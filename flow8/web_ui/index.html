<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>FLOW 8 Live Console</title>
  <meta name="theme-color" content="#0E1013" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FLOW 8" />
  <!-- Belt and braces with the hub's no-store headers, for Safari/iPad. -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-layer="main">
<div class="app-shell">
  <!-- Header: identity, link state, section navigation, scene, safety. One row. -->
  <header class="app-header" id="app-header">
    <span class="brand-mark">FLOW 8 <small class="brand-sub">LIVE CONSOLE</small></span>
    <div class="status-pill" id="status-pill" role="status" tabindex="0" aria-label="Connection status. Press to open Connection settings.">
      <span class="status-dot"></span>
      <span id="status-text">CONNECTING</span>
    </div>
    <div class="link-lamps" aria-label="Link status">
      <span class="link" title="USB MIDI out: commands can reach the mixer"><span class="lamp lamp-link" id="lamp-usb"></span>USB</span>
      <span class="link" title="MIDI in: the app hears hardware moves"><span class="lamp lamp-link" id="lamp-midi-in"></span>MIDI IN</span>
      <span class="link" title="Live link from this device to the host computer"><span class="lamp lamp-link" id="lamp-hub"></span>HUB</span>
      <span class="link" title="Flashes when the mixer reports a change"><span class="lamp lamp-rx" id="lamp-rx"></span>RX</span>
      <span class="link" title="Lit while a measured audio meter feed is running. The FLOW 8 does not send meters over MIDI."><span class="lamp lamp-link" id="lamp-meter"></span>METERS</span>
    </div>
    <nav class="cue-groups" id="cue-groups" role="tablist" aria-label="Console sections">
      <button class="cue-group active" data-group="mix" role="tab" aria-selected="true">Mix</button>
      <button class="cue-group" data-group="sound" role="tab" aria-selected="false">Sound</button>
      <button class="cue-group" data-group="presets" role="tab" aria-selected="false">Presets</button>
      <button class="cue-group" data-group="setup" role="tab" aria-selected="false">Setup</button>
    </nav>
    <div class="all-muted-chip" id="all-muted-chip" role="status" hidden>ALL MUTED</div>
    <div class="scene-display empty" id="scene-display" role="status">
      <span class="scene-label">Scene</span>
      <span class="scene-name">No scene</span>
      <span class="scene-edited">EDITED</span>
    </div>
    <time class="clock" id="clock" aria-label="Time"></time>
    <div class="safety-cluster" role="group" aria-label="Safety controls">
      <button class="hw-btn lock-btn" id="btn-lock" aria-pressed="false" title="Lock all controls against stray touches."><span class="lock-text">LOCK</span></button>
      <button class="hw-btn danger mute-all" id="btn-mute-all" data-hold="arm" title="Hold 0.6 s to mute all inputs.">MUTE ALL</button>
    </div>
  </header>

  <div class="toolbars">
  <!-- Control bar: edit tools on the left, show control on the right. Hidden in Setup. -->
  <div class="control-bar" id="control-bar">
    <div class="edit-tools" role="group" aria-label="Edit tools">
      <button class="select-badge" id="select-badge" title="Selected channel: tap to cycle">
        <span class="select-lbl">SELECT</span>
        <span class="select-num" id="select-num">01</span>
        <span class="select-name" id="select-name">MIC 1</span>
      </button>
      <button class="hw-btn" id="btn-undo" aria-label="Undo" title="Undo"><span aria-hidden="true">&#8630;</span><span class="btn-text"> Undo</span></button>
      <button class="hw-btn" id="btn-redo" aria-label="Redo" title="Redo"><span aria-hidden="true">&#8631;</span><span class="btn-text"> Redo</span></button>
      <button class="hw-btn" id="btn-copy" title="Copy channel EQ, Low Cut, Comp & Sends (never Gain/+48V)">Copy</button>
      <button class="hw-btn" id="btn-paste" title="Paste copied DSP to selected channel" hidden>Paste</button>
      <button class="hw-btn ai-btn" id="btn-flowai" aria-pressed="false" title="Open FlowAi Mix Assistant">FlowAi</button>
    </div>
    <div class="show-control" role="group" aria-label="Show control">
      <span class="group-label">SHOW</span>
      <div class="show-modes" id="show-modes" role="group" aria-label="Show modes"></div>
      <button class="hw-btn show-mode-undo" id="show-mode-undo" hidden></button>
    </div>
  </div>

  <!-- Views inside the active section (Mix and Sound only). -->
  <nav class="cue-tabs" id="cue-tabs" role="tablist" aria-label="Views in this section">
    <button class="cue-tab active" data-tab="mixer" data-group="mix" role="tab" aria-selected="true">Faders</button>
    <button class="cue-tab" data-tab="stage" data-group="mix" role="tab" aria-selected="false">Stage</button>
    <button class="cue-tab" data-tab="input" data-group="sound" role="tab" aria-selected="false" hidden>Input</button>
    <button class="cue-tab" data-tab="eq" data-group="sound" role="tab" aria-selected="false" hidden>EQ</button>
    <button class="cue-tab" data-tab="comp" data-group="sound" role="tab" aria-selected="false" hidden>Comp</button>
    <button class="cue-tab" data-tab="sends" data-group="sound" role="tab" aria-selected="false" hidden>Sends</button>
    <button class="cue-tab" data-tab="fx" data-group="sound" role="tab" aria-selected="false" hidden>FX</button>
    <button class="cue-tab" data-tab="channel" data-group="sound" role="tab" aria-selected="false" hidden>Channel</button>
  </nav>
  </div>

  <div class="conn-banner" id="conn-banner" role="alert" hidden></div>
  <div class="conn-banner meter-lost" id="meter-banner" role="status" hidden></div>

  <!-- Split-Screen Workspace: Dynamic Top Half + Persistent Bottom Fader Bank -->
  <div class="split-workspace" id="workspace">
    <!-- Dynamic Top Half -->
    <section class="top-pane" id="top-pane" aria-label="Active view"></section>

    <!-- Persistent Bottom Fader Bank (7 channels + Main LR with Bus dropdown) -->
    <main class="console-bank" id="console-bank" aria-label="Fader bank"></main>

    <!-- FlowAi Assistant Drawer -->
    <aside class="flowai-drawer" id="flowai-drawer" aria-label="FlowAi Assistant" hidden>
      <div class="insp-head">
        <div class="insp-id">
          <span class="ai-dot"></span>
          <h2 class="insp-title">FlowAi Assistant</h2>
          <span class="insp-sub">Smart Mix Advisor</span>
        </div>
        <button class="insp-close" id="flowai-close" aria-label="Close FlowAi">✕</button>
      </div>
      <div class="flowai-body" id="flowai-body"></div>
    </aside>

    <!-- Staged change plan (F7): reviewed diff, committed only on request -->
    <aside class="flowai-drawer plan-drawer" id="plan-panel" aria-label="Change plan review" hidden>
      <div class="insp-head">
        <div class="insp-id">
          <span class="plan-dot"></span>
          <h2 class="insp-title" id="plan-title">Change plan</h2>
          <span class="insp-sub" id="plan-sub">Preview only — nothing is sent yet</span>
        </div>
        <button class="insp-close" id="plan-close" aria-label="Discard change plan">✕</button>
      </div>
      <div class="flowai-body" id="plan-body" aria-live="polite"></div>
      <div class="plan-foot">
        <p class="plan-foot-note">+48V and preamp gain can never be in a plan.</p>
        <button class="hw-btn" id="plan-discard">DISCARD</button>
        <button class="hw-btn accent" id="plan-commit">COMMIT</button>
      </div>
    </aside>

    <!-- Legacy Inspector kept hidden/compatible for keyboard navigation if needed -->
    <aside class="inspector" id="inspector" aria-labelledby="insp-title" hidden>
      <div class="insp-head">
        <button class="insp-step" id="insp-prev" aria-label="Previous channel">‹</button>
        <div class="insp-id">
          <span class="insp-chip" id="insp-chip"></span>
          <h2 class="insp-title" id="insp-title" tabindex="-1">CH 01</h2>
          <span class="insp-sub" id="insp-sub"></span>
        </div>
        <button class="insp-step" id="insp-next" aria-label="Next channel">›</button>
        <button class="insp-close" id="insp-close" aria-label="Close settings">✕</button>
      </div>
      <div class="insp-body" id="insp-body"></div>
    </aside>
  </div>
</div>

<!-- Name prompt -->
<div class="modal-backdrop" id="prompt-modal">
  <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="prompt-title">
    <div class="modal-hdr"><span class="rack-title" id="prompt-title">NAME</span></div>
    <div class="modal-body">
      <label for="prompt-input" class="field-label">Name <span id="prompt-count">0/40</span></label>
      <input id="prompt-input" class="text-input" type="text" maxlength="40" autocomplete="off" />
      <div class="confirm-row">
        <button class="hw-btn" id="btn-prompt-cancel">CANCEL</button>
        <button class="hw-btn accent" id="btn-prompt-ok">SAVE</button>
      </div>
    </div>
  </div>
</div>
<input type="file" id="library-file" accept="application/json,.json" hidden />

<!-- Scribble Edit Modal -->
<div class="modal-backdrop" id="scribble-modal">
  <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="scribble-title">
    <div class="modal-hdr">
      <span class="rack-title" id="scribble-title">RENAME CHANNEL</span>
      <button class="hw-btn" id="btn-close-scribble">CLOSE</button>
    </div>
    <div class="modal-body">
      <label for="scribble-input" class="field-label">Name <span id="scribble-count">0/14</span></label>
      <input id="scribble-input" class="text-input" type="text" maxlength="14" autocomplete="off" />
      <span class="field-label">Color tag</span>
      <div class="color-row" id="scribble-colors" role="group" aria-label="Color tag"></div>
      <button class="hw-btn accent" id="btn-save-scribble">SAVE</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-hdr">
      <span class="rack-title" id="confirm-title">CONFIRM</span>
    </div>
    <div class="modal-body">
      <p id="confirm-text" class="confirm-text"></p>
      <div class="confirm-row">
        <button class="hw-btn" id="btn-confirm-cancel">CANCEL</button>
        <button class="hw-btn danger" id="btn-confirm-ok">OVERWRITE</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
