<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08090A" />
<title>FLOW 888</title>
<meta name="description" content="FLOW 888 live console for the Behringer FLOW 8 mixer: faders, mutes, EQ, sends, FX and cues over the venue network." />
<link rel="stylesheet" href="/v3/v3.css" />
</head>
<body>
<!-- FLOW 888 v3. Every command goes through POST /api/action and the host safety boundary. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M4 12h11M11 8l4 4-4 4M19 4v16"/></symbol>
  <symbol id="i-eq" viewBox="0 0 24 24"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5"/></symbol>
  <symbol id="i-comp" viewBox="0 0 24 24"><path d="M4 20 13 11h7M4 4v16h16"/></symbol>
  <symbol id="i-fxsend" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><path d="M8.5 11 17 5M8.5 13 17 19"/><circle cx="18.5" cy="4.5" r="1.8"/><circle cx="18.5" cy="19.5" r="1.8"/></symbol>
  <symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6"/></symbol>
  <symbol id="i-phones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></symbol>
  <symbol id="i-fx" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12c1.3-3 2.7-3 4 0s2.7 3 4 0"/></symbol>
  <symbol id="i-mix" viewBox="0 0 24 24"><path d="M6 3v18M12 3v18M18 3v18"/><rect x="4" y="13" width="4" height="3" rx="1"/><rect x="10" y="7" width="4" height="3" rx="1"/><rect x="16" y="11" width="4" height="3" rx="1"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h3l2-5 3 10 3-12 3 12 2-5h4"/></symbol>
  <symbol id="i-show" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 9 5 4l4 4M9 8 11 3l4 4M15 7l2-4 4 4"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9v6M20 7v10"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-usb" viewBox="0 0 24 24"><path d="M3 12h14M17 12l-3-3M17 12l-3 3M7 12V8h4M11 12v4h3"/><circle cx="19.5" cy="12" r="1.8"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-preset" viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4z"/></symbol>
  <symbol id="i-strip" viewBox="0 0 24 24"><path d="M7 3v18M17 3v18"/><rect x="4" y="13" width="6" height="3" rx="1"/><rect x="14" y="6" width="6" height="3" rx="1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></symbol>
</svg>
<div class="shell">
  <header class="bar">
    <div class="brand"><b>FLOW 888</b><small>LIVE CONSOLE</small></div>
    <button class="state" id="link" type="button" title="Host PC link and mixer link"><span class="lamp"></span><span class="tx">CONNECTING</span></button>
    <span class="state" id="midi"><svg class="ic" aria-hidden="true"><use href="#i-usb"/></svg><span class="tx">USB MIDI</span></span>
    <span class="sp"></span>
    <div class="ur">
      <button class="btn" id="btn-undo" type="button" title="Undo the last change" aria-label="Undo"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg><span class="lbl">UNDO</span></button>
      <button class="btn" id="btn-redo" type="button" title="Redo" aria-label="Redo"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg><span class="lbl">REDO</span></button>
    </div>
    <span class="sp"></span>
    <button class="safety lock" id="btn-lock" type="button" aria-pressed="false"><span class="fill"></span><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg>LOCK</button>
    <button class="safety mute" id="btn-muteall" type="button" aria-pressed="false"><span class="fill"></span><svg class="ic" aria-hidden="true"><use href="#i-mute"/></svg>MUTE ALL</button>
    <div class="setwrap">
      <button class="btn sq" id="btn-set" type="button" aria-expanded="false" aria-controls="setmenu" aria-label="Settings"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
      <div class="setmenu" id="setmenu" hidden>
        <button class="tool" id="btn-fine" type="button" aria-pressed="false" title="Faders move at a quarter of the finger travel">FINE</button>
        <button class="tool" id="btn-night" type="button" aria-pressed="false" title="Red-only display for a dark room">NIGHT</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="rail" aria-label="Pages"></nav>

  <main class="stage" id="stage" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/v3/v3.js"></script>
</body>
</html>
